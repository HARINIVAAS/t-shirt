<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Memories - F4 Clothing</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Archivo:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3efe7;--glow:#fffaf0;--fg:#1a1611;--muted:#6f685b;--gold:#8a6a2c;--strip:#fffdf8;--ink:#1a1611;--shadow:rgba(60,45,20,.22);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0b0b0b;--glow:#211c12;--fg:#f4efe4;--muted:#a39c8d;--gold:#d8bf86;--strip:#f4efe4;--ink:#17130d;--shadow:rgba(0,0,0,.6)}}
:root[data-theme="dark"]{--bg:#0b0b0b;--glow:#211c12;--fg:#f4efe4;--muted:#a39c8d;--gold:#d8bf86;--strip:#f4efe4;--ink:#17130d;--shadow:rgba(0,0,0,.6)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--fg);font-family:'Archivo',Arial,sans-serif;line-height:1.5;background:radial-gradient(ellipse at 50% 0%,var(--glow) 0%,var(--bg) 62%) no-repeat,var(--bg)}
main{max-width:520px;margin:0 auto;padding:44px 22px 36px;text-align:center}
.mark{color:var(--gold);display:block;margin:0 auto 18px}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;font-size:clamp(46px,13vw,68px);line-height:.98;margin:0 0 12px;letter-spacing:.5px}
.sub{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:600;font-size:22px;color:var(--gold);margin:0 0 34px}
.strip{background:var(--strip);color:var(--ink);padding:18px 18px 14px;border-radius:10px;box-shadow:0 18px 40px var(--shadow);transform:rotate(-1.4deg);max-width:340px;margin:0 auto;border:1px dashed rgba(138,106,44,.45);outline:6px solid var(--strip);outline-offset:-1px}
.strip figure{margin:0 0 14px}
.shot{display:block;width:100%;padding:0;border:0;background:#ddd;border-radius:3px;overflow:hidden;cursor:zoom-in}
.shot img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;filter:contrast(1.03)}
.shot:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
figcaption{font-family:'Cormorant Garamond',Georgia,serif;font-size:26px;font-weight:700;margin-top:8px;text-align:left}
.strip .tag{margin:2px 0 0;text-align:left;font-size:13px;color:#6f685b}
.note{color:var(--muted);font-size:15px;margin:34px 0 0}
footer{margin-top:40px;padding-top:20px;border-top:1px solid var(--gold);color:var(--muted);font-size:15px}
footer b{display:block;color:var(--fg);font-family:'Cormorant Garamond',Georgia,serif;font-size:24px;letter-spacing:2px;margin-bottom:2px}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.93);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
.lb.open{display:flex}
.lb img{max-width:100%;max-height:100%;border-radius:4px}
.lb button{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:18px;background:#f4efe4;color:#17130d;border:0;border-radius:20px;padding:8px 16px;font:500 15px 'Archivo',Arial,sans-serif;cursor:pointer}
@media (prefers-reduced-motion: no-preference){.strip{transition:transform .25s ease}.strip:hover{transform:rotate(0deg)}}
</style>

<script>
var lb=document.getElementById('lb'),im=document.getElementById('lbimg');
document.querySelectorAll('.shot').forEach(function(b){b.addEventListener('click',function(){im.src=b.dataset.full;im.alt=b.querySelector('img').alt;lb.classList.add('open')})});
function closeLb(){lb.classList.remove('open')}
lb.addEventListener('click',function(e){if(e.target!==im)closeLb()});
